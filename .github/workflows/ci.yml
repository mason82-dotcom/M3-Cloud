name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Lyrebird Python quality and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lyrebird

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: lyrebird/GroundStation/Python/pyproject.toml

      - name: Install quality and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e GroundStation/Python
          python -m pip install ruff radon mypy types-requests bandit pytest pymavlink==2.4.43

      - name: Ruff lint
        run: python -m ruff check GroundStation --output-format=github

      - name: Ruff format check
        run: python -m ruff format --check GroundStation

      - name: Radon complexity
        run: python scripts/check_radon_complexity.py

      - name: Mypy
        run: python -m mypy

      - name: Bandit
        run: python -m bandit -r GroundStation -ll --skip B101

      - name: GroundStation tests
        run: python -m pytest GroundStation/tests -q

  android-quality:
    name: Lyrebird Android compile and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lyrebird/LyrebirdApp/android-sdk-v5-as

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Write CI local.properties
        run: |
          {
            echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            echo "AIRCRAFT_API_KEY=ci-placeholder"
            echo "MAPLIBRE_TOKEN=dummy"
          } > local.properties

      - name: Spotless, compile, and unit tests
        run: ./gradlew --no-daemon :app:spotlessKotlinCheck :app:compileCurrentDebugKotlin :app:testCurrentDebugUnitTest

      - name: Verify optional release signing path
        run: |
          KEYSTORE="$RUNNER_TEMP/lyrebird-ci-signing.jks"
          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass changeit \
            -keypass changeit \
            -alias ci-signing \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Lyrebird CI"
          STORE_FILE="$KEYSTORE" \
          STORE_PASSWORD=changeit \
          KEY_ALIAS=ci-signing \
          KEY_PASSWORD=changeit \
            ./gradlew --no-daemon :app:validateSigningCurrentRelease

      - name: Assemble and inventory Android APK
        run: |
          REPORT_DIR="build/reports/binary"
          EXTRACT_DIR="$RUNNER_TEMP/lyrebird-apk"
          mkdir -p "$REPORT_DIR"
          
          ./gradlew --no-daemon :app:dependencies --configuration currentDebugRuntimeClasspath \
            > "$REPORT_DIR/runtime-classpath.txt"
          grep -q 'com.dji:dji-sdk-v5-aircraft:5.18.0' "$REPORT_DIR/runtime-classpath.txt"
          grep -q 'com.dji:dji-sdk-v5-networkImp:5.18.0' "$REPORT_DIR/runtime-classpath.txt"
          grep -q 'com.dji:wpmzsdk:1.0.5.1' "$REPORT_DIR/runtime-classpath.txt"

          ./gradlew --no-daemon :app:assembleCurrentDebug
          APK="../lyrebird-app/build/outputs/apk/current/debug/Lyrebird-debug.apk"
          test -f "$APK"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          unzip -Z1 "$APK" | sort > "$REPORT_DIR/apk-contents.txt"
          unzip -q "$APK" 'lib/*' -d "$EXTRACT_DIR"

          ZIPALIGN="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name zipalign | sort -V | tail -1)"
          if [ -n "$ZIPALIGN" ]; then
            "$ZIPALIGN" -c -P 16 -v 4 "$APK" > "$REPORT_DIR/zipalign-16k.txt" 2>&1 || true
          else
            echo "zipalign not found" > "$REPORT_DIR/zipalign-16k.txt"
          fi

          ABIS="$(find "$EXTRACT_DIR/lib" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -u)"
          test "$ABIS" = "arm64-v8a"

          for REQUIRED_LIB in \
            libDJICSDKCommon.so \
            libDJIRegister.so \
            libDJIWaypointV2Core-CSDK.so \
            libFlightRecordEngine.so \
            libdjisdk_jni.so \
            libdjiwpv2-CSDK.so; do
            test -f "$EXTRACT_DIR/lib/arm64-v8a/$REQUIRED_LIB"
          done

          {
            echo "APK: $APK"
            sha256sum "$APK"
            echo
            find "$EXTRACT_DIR/lib" -type f -name '*.so' -print0 \
              | sort -z \
              | while IFS= read -r -d '' LIB; do
                  REL="${LIB#$EXTRACT_DIR/}"
                  echo "=== $REL ==="
                  sha256sum "$LIB"
                  file "$LIB"
                  readelf -h "$LIB" | grep -E 'Class:|Data:|Machine:'
                  readelf -lW "$LIB" | grep -E ' LOAD |GNU_RELRO|GNU_STACK' || true
                  readelf -d "$LIB" | grep -E '\(SONAME\)|\(NEEDED\)' || true
                  echo
                done
          } > "$REPORT_DIR/native-libs.txt"

          test -s "$REPORT_DIR/native-libs.txt"

      - name: Lyrebird Detekt and Lint reports
        run: ./gradlew --no-daemon qualityLyrebird

      - name: Enforce Android Lint correctness errors
        run: python3 ../../scripts/check_android_lint_errors.py ../lyrebird-app/build/reports/lint-results-currentDebug.xml

      - name: Upload Android quality reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-quality-reports
          if-no-files-found: ignore
          path: |
            lyrebird/LyrebirdApp/android-sdk-v5-as/build/reports/detekt/
            lyrebird/LyrebirdApp/android-sdk-v5-as/build/reports/binary/
            lyrebird/LyrebirdApp/lyrebird-app/build/reports/


  backend-core:
    name: M3-Cloud backend core
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: m3cloud
          POSTGRES_USER: m3cloud
          POSTGRES_PASSWORD: m3cloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U m3cloud -d m3cloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r backend/requirements-dev.lock

      - name: Compile backend
        run: PYTHONPATH=backend python -m compileall -q backend/app

      - name: Apply database migrations
        env:
          M3CLOUD_POSTGRES_DSN: postgresql+asyncpg://m3cloud:m3cloud@localhost:5432/m3cloud
        run: PYTHONPATH=backend alembic -c backend/alembic.ini upgrade head

      - name: Backend tests
        env:
          M3CLOUD_POSTGRES_DSN: postgresql+asyncpg://m3cloud:m3cloud@localhost:5432/m3cloud
        run: PYTHONPATH=backend python -m pytest -q backend/tests


  thermal-worker:
    name: M3T thermal worker
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: thermal-worker/pyproject.toml

      - name: Install thermal worker and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "thermal-worker[test]"
          python -m pip install ruff

      - name: Compile thermal worker
        run: python -m compileall -q thermal-worker/thermal_worker

      - name: Ruff thermal worker
        run: python -m ruff check thermal-worker/thermal_worker thermal-worker/tests --output-format=github

      - name: Thermal worker tests
        run: python -m pytest -q thermal-worker/tests

      - name: Validate thermal Compose profile
        run: docker compose --profile thermal config >/dev/null


  frontend-build:
    name: M3-Cloud frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build frontend
        working-directory: frontend
        run: npm run build
