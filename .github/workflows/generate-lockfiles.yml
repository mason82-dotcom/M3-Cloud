name: Generate lockfiles

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  lockfiles:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Generate reproducible dependency locks
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate Python lockfiles
        run: |
          python -m pip install "pip==25.2" "pip-tools==7.5.1"
          python -m piptools compile --generate-hashes --resolver=backtracking --output-file=backend/requirements.lock backend/requirements.in
          python -m piptools compile --generate-hashes --resolver=backtracking --output-file=backend/requirements-dev.lock backend/requirements-dev.in

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Generate frontend package lock
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfiles
        run: |
          git add backend/requirements.lock backend/requirements-dev.lock frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate reproducible dependency lockfiles"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
