name: Import Lyrebird baseline

on:
  push:
    paths:
      - .github/workflows/import-lyrebird-upstream.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout M3-Cloud
        uses: actions/checkout@v4

      - name: Fetch pinned Lyrebird baseline
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --no-checkout https://github.com/SDU-UAS-Center/lyrebird.git "$tmp/upstream"
          git -C "$tmp/upstream" checkout 419e8cd95aa5a6ab12566c2026dada867a542e44

          rm -rf lyrebird
          mkdir -p lyrebird
          rsync -a             --exclude='.git/'             --exclude='private-notes/'             --exclude='.astro/'             --exclude='node_modules/'             --exclude='.venv/'             --exclude='venv/'             --exclude='__pycache__/'             --exclude='.pytest_cache/'             --exclude='.mypy_cache/'             --exclude='.ruff_cache/'             --exclude='.gradle/'             --exclude='.kotlin/'             --exclude='build/'             --exclude='dist/'             --exclude='.idea/'             --exclude='.vscode/'             --exclude='local.properties'             "$tmp/upstream/" lyrebird/

      - name: Commit baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lyrebird
          if git diff --cached --quiet; then
            echo "No Lyrebird baseline changes."
            exit 0
          fi
          git commit -m "Import pinned Lyrebird baseline"
          git push
