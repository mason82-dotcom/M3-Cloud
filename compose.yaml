name: m3-cloud

services:
  postgres:
    image: ${POSTGIS_IMAGE:-postgis/postgis:16-3.4}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-m3cloud}
      POSTGRES_USER: ${POSTGRES_USER:-m3cloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-m3cloud} -d ${POSTGRES_DB:-m3cloud}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  emqx:
    image: ${EMQX_IMAGE:-emqx/emqx:5.10.5}
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log

  seaweedfs:
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:4.31}
    restart: unless-stopped
    command: ["server", "-s3"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-m3cloud}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-change-me-s3}
    volumes:
      - object_storage_data:/data
    ports:
      - "8333:8333"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8333/"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  dronedb:
    image: ${DRONEDB_IMAGE:-dronedb/registry:latest}
    restart: unless-stopped
    environment:
      AppSettings__Secret: ${DRONEDB_SECRET:-change-me-dronedb-secret-please-rotate}
      AppSettings__DefaultAdmin__Email: ${DRONEDB_ADMIN_EMAIL:-admin@example.com}
      AppSettings__DefaultAdmin__UserName: ${DRONEDB_ADMIN_USERNAME:-admin}
      AppSettings__DefaultAdmin__Password: ${DRONEDB_ADMIN_PASSWORD:-change-me-dronedb}
      CPL_TMPDIR: /data/temp
      TMPDIR: /data/temp
      TEMP: /data/temp
      QT_LOGGING_RULES: "*.warning=false"
    volumes:
      - dronedb_data:/data
    ports:
      - "${DRONEDB_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/quickhealth"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      M3CLOUD_ENVIRONMENT: ${M3CLOUD_ENVIRONMENT:-development}
      M3CLOUD_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-m3cloud}:${POSTGRES_PASSWORD:-change-me-postgres}@postgres:5432/${POSTGRES_DB:-m3cloud}
      M3CLOUD_REDIS_URL: redis://redis:6379/0
      M3CLOUD_S3_ENDPOINT: http://seaweedfs:8333
      M3CLOUD_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-m3cloud}
      M3CLOUD_S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-s3}
      M3CLOUD_EMQX_HOST: emqx
      M3CLOUD_EMQX_PORT: 1883
      M3CLOUD_DJI_MQTT_ENABLED: ${M3CLOUD_DJI_MQTT_ENABLED:-false}
      M3CLOUD_DJI_MQTT_CLIENT_ID: ${M3CLOUD_DJI_MQTT_CLIENT_ID:-m3-cloud}
      M3CLOUD_DJI_MQTT_USERNAME: ${M3CLOUD_DJI_MQTT_USERNAME:-}
      M3CLOUD_DJI_MQTT_PASSWORD: ${M3CLOUD_DJI_MQTT_PASSWORD:-}
      M3CLOUD_DJI_PILOT_ENABLED: ${M3CLOUD_DJI_PILOT_ENABLED:-false}
      M3CLOUD_DJI_PILOT_BOOTSTRAP_TOKEN: ${M3CLOUD_DJI_PILOT_BOOTSTRAP_TOKEN:-}
      M3CLOUD_DJI_CLOUD_APP_ID: ${M3CLOUD_DJI_CLOUD_APP_ID:-}
      M3CLOUD_DJI_CLOUD_APP_KEY: ${M3CLOUD_DJI_CLOUD_APP_KEY:-}
      M3CLOUD_DJI_CLOUD_APP_LICENSE: ${M3CLOUD_DJI_CLOUD_APP_LICENSE:-}
      M3CLOUD_DJI_PILOT_MQTT_URL: ${M3CLOUD_DJI_PILOT_MQTT_URL:-}
      M3CLOUD_DJI_PILOT_MQTT_USERNAME: ${M3CLOUD_DJI_PILOT_MQTT_USERNAME:-}
      M3CLOUD_DJI_PILOT_MQTT_PASSWORD: ${M3CLOUD_DJI_PILOT_MQTT_PASSWORD:-}
      M3CLOUD_DJI_WORKSPACE_ID: ${M3CLOUD_DJI_WORKSPACE_ID:-}
      M3CLOUD_DJI_PLATFORM_NAME: ${M3CLOUD_DJI_PLATFORM_NAME:-M3-Cloud}
      M3CLOUD_DJI_WORKSPACE_NAME: ${M3CLOUD_DJI_WORKSPACE_NAME:-M3-Cloud}
      M3CLOUD_DJI_WORKSPACE_DESCRIPTION: ${M3CLOUD_DJI_WORKSPACE_DESCRIPTION:-M3-Cloud DJI Pilot 2 workspace}
      M3CLOUD_LIVE_REDIS_CHANNEL: ${M3CLOUD_LIVE_REDIS_CHANNEL:-m3:live}
      M3CLOUD_LYREBIRD_ENABLED: ${M3CLOUD_LYREBIRD_ENABLED:-false}
      M3CLOUD_LYREBIRD_HOSTS: ${M3CLOUD_LYREBIRD_HOSTS:-}
      M3CLOUD_LYREBIRD_HTTP_PORT: ${M3CLOUD_LYREBIRD_HTTP_PORT:-8080}
      M3CLOUD_LYREBIRD_TELEMETRY_PORT: ${M3CLOUD_LYREBIRD_TELEMETRY_PORT:-8081}
      M3CLOUD_LYREBIRD_TIMEOUT_SECONDS: ${M3CLOUD_LYREBIRD_TIMEOUT_SECONDS:-1.5}
      M3CLOUD_LYREBIRD_MAVLINK_PORT: ${M3CLOUD_LYREBIRD_MAVLINK_PORT:-14550}
      M3CLOUD_LYREBIRD_MAVLINK_PEER_PORT: ${M3CLOUD_LYREBIRD_MAVLINK_PEER_PORT:-14550}
      M3CLOUD_LYREBIRD_MAVLINK_TTL_SECONDS: ${M3CLOUD_LYREBIRD_MAVLINK_TTL_SECONDS:-5}
      M3CLOUD_MISSION_UPLOAD_ENABLED: ${M3CLOUD_MISSION_UPLOAD_ENABLED:-false}
      M3CLOUD_MISSION_UPLOAD_TIMEOUT_SECONDS: ${M3CLOUD_MISSION_UPLOAD_TIMEOUT_SECONDS:-6}
      M3CLOUD_MEDIA_IMPORT_ENABLED: ${M3CLOUD_MEDIA_IMPORT_ENABLED:-true}
      M3CLOUD_MEDIA_IMPORT_ROOT: /media-import
      M3CLOUD_MEDIA_IMPORT_HANDOFF_ROOT: ${M3CLOUD_MEDIA_IMPORT_HANDOFF_ROOT:-}
      M3CLOUD_MEDIA_IMPORT_SCAN_INTERVAL_SECONDS: ${M3CLOUD_MEDIA_IMPORT_SCAN_INTERVAL_SECONDS:-15}
      M3CLOUD_MEDIA_IMPORT_MIN_AGE_SECONDS: ${M3CLOUD_MEDIA_IMPORT_MIN_AGE_SECONDS:-5}
      M3CLOUD_MEDIA_FILENAME_TIMEZONE: ${M3CLOUD_MEDIA_FILENAME_TIMEZONE:-UTC}
      M3CLOUD_MEDIA_AUTO_MATCH_FLIGHTS: ${M3CLOUD_MEDIA_AUTO_MATCH_FLIGHTS:-true}
      M3CLOUD_MEDIA_AUTO_MATCH_MARGIN_SECONDS: ${M3CLOUD_MEDIA_AUTO_MATCH_MARGIN_SECONDS:-300}
      M3CLOUD_MEDIA_AUTO_MATCH_MAX_DISTANCE_M: ${M3CLOUD_MEDIA_AUTO_MATCH_MAX_DISTANCE_M:-100}
      M3CLOUD_MEDIA_AUTO_MATCH_MIN_GPS_FRACTION: ${M3CLOUD_MEDIA_AUTO_MATCH_MIN_GPS_FRACTION:-0.8}
      M3CLOUD_MEDIA_AUTO_MATCH_MAX_GPS_SAMPLES: ${M3CLOUD_MEDIA_AUTO_MATCH_MAX_GPS_SAMPLES:-64}
      M3CLOUD_MEDIA_AUTO_MATCH_MAX_SAMPLE_TIME_DELTA_SECONDS: ${M3CLOUD_MEDIA_AUTO_MATCH_MAX_SAMPLE_TIME_DELTA_SECONDS:-5}
      M3CLOUD_PROCESSING_IMPORT_ROOT: /processing-import
      M3CLOUD_PROCESSING_IMPORT_HANDOFF_ROOT: ${M3CLOUD_PROCESSING_IMPORT_HANDOFF_ROOT:-}
      M3CLOUD_DRONEDB_ENABLED: ${M3CLOUD_DRONEDB_ENABLED:-true}
      M3CLOUD_DRONEDB_URL: ${M3CLOUD_DRONEDB_URL:-http://dronedb:5000}
      M3CLOUD_DRONEDB_PUBLIC_URL: ${M3CLOUD_DRONEDB_PUBLIC_URL:-http://localhost:5000}
      M3CLOUD_DRONEDB_USERNAME: ${DRONEDB_ADMIN_USERNAME:-admin}
      M3CLOUD_DRONEDB_PASSWORD: ${DRONEDB_ADMIN_PASSWORD:-change-me-dronedb}
      M3CLOUD_DRONEDB_ORG: ${M3CLOUD_DRONEDB_ORG:-m3cloud}
      M3CLOUD_DRONEDB_TIMEOUT_SECONDS: ${M3CLOUD_DRONEDB_TIMEOUT_SECONDS:-300}
      M3CLOUD_WEBODM_ENABLED: ${M3CLOUD_WEBODM_ENABLED:-false}
      M3CLOUD_WEBODM_URL: ${M3CLOUD_WEBODM_URL:-}
      M3CLOUD_WEBODM_TOKEN: ${M3CLOUD_WEBODM_TOKEN:-}
      M3CLOUD_WEBODM_USERNAME: ${M3CLOUD_WEBODM_USERNAME:-}
      M3CLOUD_WEBODM_PASSWORD: ${M3CLOUD_WEBODM_PASSWORD:-}
      M3CLOUD_WEBODM_TIMEOUT_SECONDS: ${M3CLOUD_WEBODM_TIMEOUT_SECONDS:-300}
      M3CLOUD_PROCESSING_POLL_INTERVAL_SECONDS: ${M3CLOUD_PROCESSING_POLL_INTERVAL_SECONDS:-5}
    volumes:
      - ${M3CLOUD_MEDIA_IMPORT_HOST_PATH:-./media-import}:/media-import:ro
      - ${M3CLOUD_PROCESSING_IMPORT_HOST_PATH:-./processing-import}:/processing-import:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      dronedb:
        condition: service_healthy
      emqx:
        condition: service_started
    ports:
      - "8000:8000"
      - "${M3CLOUD_LYREBIRD_MAVLINK_PORT:-14550}:${M3CLOUD_LYREBIRD_MAVLINK_PORT:-14550}/udp"

  thermal-worker:
    profiles: ["thermal"]
    platform: linux/amd64
    build:
      context: ./thermal-worker
    restart: unless-stopped
    environment:
      DJI_TSDK_DIR: /opt/dji-tsdk
      DJI_TSDK_VERSION: ${DJI_TSDK_VERSION:-1.8_20251211}
      M3CLOUD_API_BASE: http://backend:8000
      M3_THERMAL_LOG_LEVEL: ${M3_THERMAL_LOG_LEVEL:-INFO}
      M3_THERMAL_HOTSPOT_DELTA_C: ${M3_THERMAL_HOTSPOT_DELTA_C:-10}
      M3_THERMAL_HOTSPOT_MIN_PIXELS: ${M3_THERMAL_HOTSPOT_MIN_PIXELS:-4}
    command: ["--watch"]
    volumes:
      - ${DJI_TSDK_HOST_PATH:-./dji-thermal-sdk}:/opt/dji-tsdk:ro
      - ${M3CLOUD_MEDIA_IMPORT_HOST_PATH:-./media-import}:/media-import:ro
      - ${M3CLOUD_PROCESSING_IMPORT_HOST_PATH:-./processing-import}:/processing-import
    depends_on:
      - backend

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-}
        VITE_MAP_FALLBACK_TILE_URL: ${VITE_MAP_FALLBACK_TILE_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"


volumes:
  postgres_data:
  redis_data:
  emqx_data:
  emqx_log:
  object_storage_data:
  dronedb_data:
