// Top-level build file where you can add configuration options common to all sub-projects/modules.
apply from: rootProject.file('dependencies.gradle')

buildscript {
    dependencyLocking {
        lockMode = LockMode.STRICT
    }

    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }

    repositories {
        google()
        mavenCentral()
        maven { url = 'https://plugins.gradle.org/m2/' }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$KOTLIN_VERSION"
        classpath 'com.diffplug.spotless:spotless-plugin-gradle:8.10.0'
        classpath 'io.gitlab.arturbosch.detekt:detekt-gradle-plugin:1.23.8'
    }
}

apply plugin: 'io.gitlab.arturbosch.detekt'


allprojects {
    dependencyLocking {
        lockMode = LockMode.STRICT
    }

    repositories {
        google()
        mavenCentral()
        maven { url = JITPACK_MAVEN_URL }
    }

}

def registerLockStateResolver = { Project target, List<String> configurationNames ->
    def lockedConfigurations = configurationNames as Set
    target.configurations.configureEach { configuration ->
        if (lockedConfigurations.contains(configuration.name)) {
            configuration.resolutionStrategy.activateDependencyLocking()
        }
    }

    target.tasks.register('resolveProductionLockState') {
        notCompatibleWithConfigurationCache('Resolves selected configurations to write dependency lock state')
        doLast {
            if (!gradle.startParameter.writeDependencyLocks) {
                throw new GradleException("$path must be run with --write-locks")
            }
            configurationNames.each { name ->
                def configuration = target.configurations.getByName(name)
                if (!configuration.canBeResolved) {
                    throw new GradleException("${target.path}:${name} is not resolvable")
                }
                // Dependency locking needs the resolved component graph, not the
                // configuration's files. Resolving files forces AGP 9.3 to choose
                // between the many artifact variants exposed by Android library
                // projects (classes jar, lint model, manifest, R class, ...), which
                // is ambiguous for :uxsdk. The resolution result records the same
                // external dependency graph for lock state without selecting an
                // artifact type.
                configuration.incoming.resolutionResult.allComponents.size()
            }
        }
    }
}

registerLockStateResolver(project(':app'), [
        'currentDebugCompileClasspath',
        'currentDebugRuntimeClasspath',
        'currentReleaseCompileClasspath',
        'currentReleaseRuntimeClasspath',
        'demoBiomassDebugCompileClasspath',
        'demoBiomassDebugRuntimeClasspath',
        'demoBiomassReleaseCompileClasspath',
        'demoBiomassReleaseRuntimeClasspath',
        'currentDebugUnitTestCompileClasspath',
        'currentDebugUnitTestRuntimeClasspath',
        'currentDebugLintChecksClasspath',
        'androidLintTool',
        'kotlinBuildToolsApiClasspath',
])

registerLockStateResolver(project(':uxsdk'), [
        'debugCompileClasspath',
        'debugRuntimeClasspath',
        'releaseCompileClasspath',
        'releaseRuntimeClasspath',
        'debugUnitTestCompileClasspath',
        'debugUnitTestRuntimeClasspath',
        'debugLintChecksClasspath',
        'androidLintTool',
        'kotlinBuildToolsApiClasspath',
])

def sampleJavaSource = file('../lyrebird-app/src/main/java')
def uxsdkJavaSource = file('../android-sdk-v5-uxsdk/src/main/java')
def detektTaskClass = buildscript.classLoader.loadClass('io.gitlab.arturbosch.detekt.Detekt')

def lyrebirdSourceIncludes = [
        'com/lyrebird/rc/controller/**/*.kt',
        'com/lyrebird/rc/edge/**/*.kt',
        'com/lyrebird/rc/formation/**/*.kt',
        'com/lyrebird/rc/logger/**/*.kt',
        'com/lyrebird/rc/server/**/*.kt',
        'com/lyrebird/rc/webrtc/**/*.kt',
        'com/lyrebird/rc/DroneControlProfiles.kt',
        'com/lyrebird/rc/TestToolsVM.kt',
        'com/lyrebird/rc/FlightDeckActivity.kt',
]

project(':app') {
    apply plugin: 'com.diffplug.spotless'

    spotless {
        kotlin {
            target lyrebirdSourceIncludes
            ktlint('1.5.0')
        }
    }
}

detekt {
    buildUponDefaultConfig = true
    allRules = false
    ignoreFailures = true
    config.setFrom(files('config/detekt/detekt.yml'))
}

tasks.withType(detektTaskClass).configureEach {
    parallel = true
    reports {
        html.required.set(true)
        xml.required.set(true)
        txt.required.set(true)
        sarif.required.set(true)
    }
}

tasks.register('detektLyrebird', detektTaskClass) {
    group = 'verification'
    description = 'Run Detekt on Lyrebird-owned Kotlin code only.'
    buildUponDefaultConfig = true
    allRules = false
    ignoreFailures = true
    config.setFrom(files('config/detekt/detekt.yml'))
    setSource(files(sampleJavaSource))
    include lyrebirdSourceIncludes
    reports {
        html.outputLocation.set(new File("$buildDir/reports/detekt/lyrebird.html"))
        xml.outputLocation.set(new File("$buildDir/reports/detekt/lyrebird.xml"))
        txt.outputLocation.set(new File("$buildDir/reports/detekt/lyrebird.txt"))
        sarif.outputLocation.set(new File("$buildDir/reports/detekt/lyrebird.sarif"))
    }
}

tasks.register('detektDji', detektTaskClass) {
    group = 'verification'
    description = 'Run Detekt on DJI sample and UXSDK Kotlin code, excluding Lyrebird-owned packages.'
    buildUponDefaultConfig = true
    allRules = false
    ignoreFailures = true
    config.setFrom(files('config/detekt/detekt.yml'))
    setSource(files(sampleJavaSource, uxsdkJavaSource))
    include '**/*.kt'
    exclude lyrebirdSourceIncludes
    reports {
        html.outputLocation.set(new File("$buildDir/reports/detekt/dji.html"))
        xml.outputLocation.set(new File("$buildDir/reports/detekt/dji.xml"))
        txt.outputLocation.set(new File("$buildDir/reports/detekt/dji.txt"))
        sarif.outputLocation.set(new File("$buildDir/reports/detekt/dji.sarif"))
    }
}

tasks.register('qualityLyrebird') {
    group = 'verification'
    description = 'Run ktlint formatting checks, Detekt, and Android Lint for Lyrebird app code.'
    dependsOn ':app:spotlessKotlinCheck', 'detektLyrebird', ':app:lintCurrentDebug'
}

tasks.register('qualityDji') {
    group = 'verification'
    description = 'Run Detekt and Android Lint for DJI/vendor code separately from Lyrebird-owned code.'
    dependsOn 'detektDji', ':uxsdk:lintDebug'
}
