# UgCS PX4 VSM connection block for Lyrebird (MAVLink 2), Mavic 3 Enterprise profile.
#
# Where this goes: append/merge into the PX4 VSM's own config file on the UgCS host,
# NOT into a Lyrebird file. Exact locations (per UgCS's own "Configuration file" docs):
#   Windows: C:\Program Files (x86)\UgCS\bin\vsm-px4.conf
#   GNU/Linux: /etc/opt/ugcs/vsm-px4.conf
#   macOS: /Users/[user name]/Library/Application Support/UGCS/configuration/vsm-px4.conf
#   Or configurable from the UgCS Service Manager GUI (Vehicles/VSMs section).
# Restart the PX4 VSM service after editing (Service Manager -> Restart), UgCS itself
# does not need to restart.
#
# Replace <IP-DER-RC-PRO> with the RC Pro / RC Plus 2's actual WLAN IP address before
# use (find it: RC Settings > About, or `adb shell ip addr show wlan0`).
#
# Background:
#   - Lyrebird broadcasts a MAVLink 2 heartbeat on UDP 14550 and only starts sending
#     full telemetry to a peer once that peer has sent its own heartbeat first --
#     "connection.udp_out" below is exactly that: VSM actively dials out to the RC.
#   - local_port is set explicitly (14551) rather than left to bind a random port, so
#     the link survives a VSM restart at a stable, firewall-predictable local port and
#     doesn't collide if something else on the UgCS host also wants an ephemeral UDP
#     port in that range.
#   - Lyrebird presents itself as MAV_AUTOPILOT_PX4 deliberately (see
#     src/content/docs/mavlink.md, "why it looks like PX4 to QGroundControl") so a
#     generic PX4 VSM gets Fly/Plan views without any Lyrebird-specific VSM.

connection.udp_out.lyrebird.address = <IP-DER-RC-PRO>
connection.udp_out.lyrebird.port = 14550
connection.udp_out.lyrebird.local_port = 14551

# MAVLink 2 explicitly, rather than letting VSM negotiate/fall back to v1. Lyrebird's
# endpoint is MAVLink-2-only; being explicit here avoids a VSM that defaults to v1
# silently downgrading a mixed-fleet setup.
vehicle.px4.mavlink_protocol_version = 2

# Lyrebird's own control-loop heading (nose-forward vs. hold-heading) is chosen by the
# mission/command that flies a leg, not by VSM computing a heading itself -- turning
# UgCS's own autoheading off avoids VSM fighting Lyrebird's yaw handling with its own
# heading estimate/commands.
vehicle.px4.autoheading = no

# 0 = no camera trigger wired through this VSM connection. Lyrebird's camera/gimbal
# actions travel as ordinary MAVLink commands (IMAGE_START_CAPTURE, DO_GIMBAL_MANAGER_*)
# inside the mission item list itself (see src/content/docs/missions.md) rather than a
# separate hardware camera-trigger line, so there is nothing for this VSM feature to
# drive.
vehicle.px4.camera_trigger_type = 0
